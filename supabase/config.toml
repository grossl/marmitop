# supabase/config.toml — local Supabase CLI stack for Marmitop.
#
# Ports follow ADR-001 (54421 API, 54422 Postgres, 54423 Studio) and stay clear
# of the sibling stacks: web-nf uses 5532x and backend-uatis uses 5632x, the
# CLI default is 5432x. Every other port below sits in the same 544xx block.
# `bun run dev:stack` (scripts/local-dev.ts) starts this stack, resets it and
# writes each app's env file (docs/11.operations.md "Local development").

project_id = "marmitop"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54422
shadow_port = 54420
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

# Realtime streams orders, messages and conversations to the dashboard
# (ADR-004, migration 0013).
[realtime]
enabled = true

[studio]
enabled = true
port = 54423
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# Mailpit (formerly inbucket).
[local_smtp]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "50MiB"

# Menu images (05.data-model.md "Storage buckets"). Migration 0014 creates the
# same bucket and its policies, so hosted projects match.
[storage.buckets.menu-images]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100", "http://localhost:3100/**", "http://127.0.0.1:3100", "http://127.0.0.1:3100/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Members are added by an admin (FR-001–009); there is no public sign-up.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
email_sent = 100
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 54428

[analytics]
enabled = false
port = 54427
backend = "postgres"
